aid: absencesoft
name: AbsenceSoft
description: >-
  AbsenceSoft is a leave and accommodations management SaaS platform that
  automates and streamlines the administration of employee absences and
  workplace accommodations. Its Compliance Engine calculates employee
  eligibility across 200+ federal, state, and territorial leave laws including
  FMLA, ADA, and PWFA, with intelligent workflow automation, ACE communication
  packet generation, interactive accommodations tracking, dashboards, and an
  employee self-service portal. AbsenceSoft is API-first: it exposes an open,
  system-agnostic REST API (OpenAPI 3.1, OAuth2) plus webhooks and file-based
  batch sync so HR, payroll, and HRIS teams can build integrations
  independently. It serves 400+ large enterprises across healthcare, higher
  education, K-12, banking and finance, TPAs, and PEOs, supporting more than 7
  million lives.
